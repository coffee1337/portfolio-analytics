services:
  - type: web
    name: portfolio-analytics
    runtime: python
    plan: free
    # Собранная SPA закоммичена в app/static, поэтому сервис поднимается даже
    # без Node. Если в образе есть npm — фронтенд пересобирается на месте.
    buildCommand: >-
      pip install -r requirements.txt &&
      { command -v npm >/dev/null 2>&1 &&
      (cd web && npm ci && npm run build) ||
      echo "[build] npm не найден — используется закоммиченная app/static"; }
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      # Строка подключения Neon (Dashboard → проект → Connect → Connection string)
      - key: DATABASE_URL
        sync: false
      - key: SITE_KEY
        sync: false
      - key: ADMIN_TOKEN
        generateValue: true
      - key: VISITOR_SALT
        generateValue: true
      - key: ALLOWED_ORIGINS
        value: https://coffee1337.github.io,http://localhost:5173,http://localhost:4173
      - key: GEO_LOOKUP
        value: "1"

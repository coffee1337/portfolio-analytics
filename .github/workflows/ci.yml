name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # The SPA ships as a committed bundle; a stale or half-deleted bundle is a
      # production bug that type-checks fine, so it is checked before anything else.
      - name: Committed SPA bundle is consistent
        run: |
          python3 - <<'PY'
          import pathlib
          import re
          import sys

          static = pathlib.Path("app/static")
          assets = static / "assets"
          index = static / "index.html"
          problems = []

          if not index.is_file():
              problems.append("app/static/index.html is missing")
          if not assets.is_dir():
              problems.append("app/static/assets is missing")

          if index.is_file():
              html = index.read_text(encoding="utf-8")
              refs = sorted(set(re.findall(r'/assets/([^"\'>\s]+)', html)))
              if not refs:
                  problems.append("index.html references no /assets/* files")
              for ref in refs:
                  if not (assets / ref).is_file():
                      problems.append(f"index.html references missing asset: {ref}")

          if assets.is_dir():
              for pattern, label in (("index-*.js", "JS"), ("index-*.css", "CSS")):
                  found = sorted(p.name for p in assets.glob(pattern))
                  if len(found) != 1:
                      problems.append(f"expected exactly one {label} bundle, found: {found}")

          if problems:
              print("\n".join(f"::error::{item}" for item in problems))
              sys.exit(1)
          print("static bundle ok")
          PY

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python dependencies
        run: pip install -r requirements.txt pytest

      - name: pytest
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build SPA (TypeScript + Vite)
        working-directory: web
        run: |
          npm ci
          npm run build
